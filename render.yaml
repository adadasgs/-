services:
  - type: web
    name: astokzi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATA_DIR
        value: ./data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_LOGIN
        value: astokzi
      - key: ADMIN_PASSWORD
        sync: false
