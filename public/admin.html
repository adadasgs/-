<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>ASTOKZI — Админ-панель</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><div id="loginBox" class="admin-login"><a class="brand" href="/">ASTOKZI<span>®</span></a><div class="panel"><div class="eyebrow">ЗАЩИЩЁННЫЙ ДОСТУП</div><h2>Вход в админку</h2><form id="loginForm"><label>Логин<input id="login" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button class="primary-btn block" type="submit">Войти в панель</button></form><p class="muted"><a href="/">← Вернуться на сайт</a></p></div></div>
<div id="adminApp" class="admin-layout hidden"><aside class="admin-side"><a class="brand" href="/">ASTOKZI<span>®</span></a><div class="muted" id="adminName"></div><button class="active" data-section="dashboard">Обзор</button><button data-section="orders">Заказы</button><button data-section="topups">Пополнения</button><button data-section="users">Пользователи</button><button data-section="reviews">Отзывы</button><button data-section="admins">Администраторы</button><button data-section="settings">Настройки</button><button id="logoutBtn">Выйти</button><a class="muted" href="/" style="display:block;margin:22px 10px;font-size:12px">← Открыть сайт</a></aside><main class="admin-main"><h1 id="sectionTitle">Обзор</h1><div id="adminContent"></div></main></div><div id="toast" class="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const titles={dashboard:"Обзор",orders:"Заказы",topups:"Пополнения",users:"Пользователи",reviews:"Отзывы",admins:"Администраторы",settings:"Настройки"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(s){const e=$("#toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600);}
async function api(path,opt={}){const c={credentials:"same-origin",...opt,headers:{...(opt.body?{"Content-Type":"application/json"}:{}),...(opt.headers||{})}};if(c.body&&typeof c.body!=="string")c.body=JSON.stringify(c.body);const r=await fetch("/api"+path,c);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||"Ошибка запроса");return d;}
function money(v){return new Intl.NumberFormat("ru-RU").format(Number(v)||0);}
function status(s){return({pending:"Ожидает",processing:"В работе",completed:"Выполнен",cancelled:"Отменён",approved:"Подтверждено",rejected:"Отклонено"})[s]||s;}
async function check(){try{const d=await api("/admin/me");$("#adminName").textContent="Вы вошли: "+d.login;$("#loginBox").classList.add("hidden");$("#adminApp").classList.remove("hidden");await openSection("dashboard");}catch{$("#loginBox").classList.remove("hidden");$("#adminApp").classList.add("hidden");}}
async function openSection(s){$("#sectionTitle").textContent=titles[s]||"Админка";document.querySelectorAll("[data-section]").forEach(b=>b.classList.toggle("active",b.dataset.section===s));const c=$("#adminContent");c.innerHTML='<div class="panel">Загрузка…</div>';try{
 if(s==="dashboard"){const d=await api("/admin/dashboard");c.innerHTML='<div class="admin-grid">'+[['Заказы',d.orders],['Пользователи',d.users],['Ожидают пополнения',d.pendingTopups],['Отзывы на проверке',d.reviews]].map(x=>'<div class="stat-card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join("")+'</div><div class="panel">Выберите раздел слева, чтобы управлять сайтом.</div>';}
 if(s==="orders"){const a=await api("/admin/orders");c.innerHTML='<div class="panel"><table class="admin-table"><thead><tr><th>Заказ</th><th>Пользователь</th><th>Сумма</th><th>Статус</th><th>Действие</th></tr></thead><tbody>'+a.map(x=>'<tr><td>#'+x.id+'<br>'+esc(x.product_name)+' × '+x.quantity+'<br><small>'+new Date(x.created_at).toLocaleString("ru-RU")+'</small></td><td>'+esc(x.username||"Пользователь")+'</td><td>'+money(x.total)+' '+(x.payment_method==="stars"?"⭐":"₽")+'</td><td>'+status(x.status)+'</td><td><select data-order-status="'+x.id+'"><option value="pending">Ожидает</option><option value="processing">В работе</option><option value="completed">Выполнен</option><option value="cancelled">Отменён</option></select><button data-save-order="'+x.id+'">Сохранить</button></td></tr>').join("")+'</tbody></table></div>';a.forEach(x=>{const e=document.querySelector('[data-order-status="'+x.id+'"]');if(e)e.value=x.status;});}
 if(s==="topups"){const a=await api("/admin/topups");c.innerHTML='<div class="panel"><table class="admin-table"><thead><tr><th>Заявка</th><th>Пользователь</th><th>Сумма</th><th>Чек</th><th>Статус</th><th>Действие</th></tr></thead><tbody>'+a.map(x=>'<tr><td>#'+x.id+'<br><small>'+new Date(x.created_at).toLocaleString("ru-RU")+'</small></td><td>'+esc(x.username||"Пользователь")+'</td><td>'+money(x.amount)+' ₽</td><td><button data-image="'+x.id+'">Открыть чек</button></td><td>'+status(x.status)+'</td><td>'+(x.status==="pending"?'<button data-topup="'+x.id+'" data-status="approved">Подтвердить</button><button data-topup="'+x.id+'" data-status="rejected">Отклонить</button>':"—")+'</td></tr>').join("")+'</tbody></table></div>';}
 if(s==="users"){const a=await api("/admin/users");c.innerHTML='<div class="panel"><table class="admin-table"><thead><tr><th>Пользователь</th><th>Баланс</th><th>Дата</th><th>Изменить баланс</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.username)+'<br><small>'+esc(x.id)+'</small></td><td>'+money(x.balance)+' ₽</td><td>'+new Date(x.created_at).toLocaleDateString("ru-RU")+'</td><td><input style="width:100px" type="number" id="balance-'+esc(x.id)+'" placeholder="+/- ₽"><button data-balance="'+esc(x.id)+'">Применить</button></td></tr>').join("")+'</tbody></table></div>';}
 if(s==="reviews"){const a=await api("/admin/reviews");c.innerHTML='<div class="panel"><table class="admin-table"><thead><tr><th>Автор</th><th>Оценка</th><th>Отзыв</th><th>Статус</th><th>Действие</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+x.rating+'/5</td><td>'+esc(x.message)+'</td><td>'+status(x.status)+'</td><td>'+(x.status==="pending"?'<button data-review="'+x.id+'" data-status="approved">Опубликовать</button><button data-review="'+x.id+'" data-status="rejected">Отклонить</button>':"—")+'</td></tr>').join("")+'</tbody></table></div>';}
 if(s==="admins"){const a=await api("/admin/admins");c.innerHTML='<div class="columns"><div class="panel"><h3>Администраторы</h3>'+a.map(x=>'<div class="history-row"><b>'+esc(x.login)+'</b><small class="muted">'+new Date(x.created_at).toLocaleDateString("ru-RU")+'</small></div>').join("")+'</div><form id="addAdminForm" class="panel"><h3>Добавить администратора</h3><label>Логин<input name="login" required minlength="3"></label><label>Пароль<input name="password" type="password" required minlength="8"></label><button class="primary-btn block">Добавить</button></form></div>';}
 if(s==="settings"){c.innerHTML='<div class="panel" style="max-width:520px;margin-bottom:16px"><h3>Резервная копия данных</h3><p class="muted">Перед переносом базы скачайте файл с пользователями, балансами, заказами, пополнениями, отзывами и администраторами. Храните его в безопасном месте.</p><a class="primary-btn" href="/api/admin/export">Скачать резервную копию</a></div><form id="credentialsForm" class="panel" style="max-width:520px"><h3>Изменить логин и пароль</h3><label>Текущий пароль<input name="currentPassword" type="password" required></label><label>Новый логин<input name="newLogin" required minlength="3"></label><label>Новый пароль<input name="newPassword" type="password" required minlength="8"></label><label>Повторите новый пароль<input name="confirmPassword" type="password" required minlength="8"></label><button class="primary-btn block">Сохранить данные</button></form>';}
 }catch(e){c.innerHTML='<div class="panel">'+esc(e.message)+'</div>';}}
document.addEventListener("submit",async e=>{if(e.target.id==="loginForm"){e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;try{await api("/admin/login",{method:"POST",body:{login:$("#login").value,password:$("#password").value}});$("#password").value="";await check();}catch(x){toast(x.message);}finally{b.disabled=false;}}
if(e.target.id==="credentialsForm"){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api("/admin/change-credentials",{method:"POST",body:data});toast("Данные администратора обновлены");await check();}catch(x){toast(x.message);}}
if(e.target.id==="addAdminForm"){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api("/admin/admins",{method:"POST",body:data});toast("Администратор добавлен");await openSection("admins");}catch(x){toast(x.message);}}});
document.addEventListener("click",async e=>{const sec=e.target.closest("[data-section]");if(sec){openSection(sec.dataset.section);return;}if(e.target.id==="logoutBtn"){try{await api("/admin/logout",{method:"POST"});}catch{}location.href="/admin";return;}
const order=e.target.closest("[data-save-order]");if(order){const id=order.dataset.saveOrder,statusValue=document.querySelector('[data-order-status="'+id+'"]').value;try{await api("/admin/orders/"+id+"/status",{method:"POST",body:{status:statusValue}});toast("Статус заказа обновлён");openSection("orders");}catch(x){toast(x.message);}return;}
const top=e.target.closest("[data-topup]");if(top){try{await api("/admin/topups/"+top.dataset.topup+"/status",{method:"POST",body:{status:top.dataset.status}});toast("Заявка обработана");openSection("topups");}catch(x){toast(x.message);}return;}
const rev=e.target.closest("[data-review]");if(rev){try{await api("/admin/reviews/"+rev.dataset.review+"/status",{method:"POST",body:{status:rev.dataset.status}});toast("Отзыв обработан");openSection("reviews");}catch(x){toast(x.message);}return;}
const bal=e.target.closest("[data-balance]");if(bal){const id=bal.dataset.balance,amount=Number($("#balance-"+CSS.escape(id)).value);try{await api("/admin/users/"+encodeURIComponent(id)+"/balance",{method:"POST",body:{amount}});toast("Баланс изменён");openSection("users");}catch(x){toast(x.message);}return;}
const img=e.target.closest("[data-image]");if(img){try{const r=await fetch("/api/admin/topups/"+img.dataset.image+"/image",{credentials:"same-origin"});if(!r.ok)throw Error("Не удалось загрузить чек");const d=await r.text();const w=window.open();if(w){w.document.write('<img style="max-width:100%;height:auto" src="'+d.replace(/"/g,"&quot;")+'">');w.document.close();}}catch(x){toast(x.message);}}
});
check();
</script></body></html>
